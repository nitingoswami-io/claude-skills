  <text x="716" y="200" text-anchor="middle" font-size="12">learning</text>
  <text x="32" y="380" text-anchor="start" font-size="12" font-weight="700">Action space · external (grounding)</text>
  <text x="150.0" y="413.0" text-anchor="middle" class="sk-accent">Dialogue</text>
  <text x="150.0" y="428.0" text-anchor="middle" font-size="11">talk to a person</text>
  <text x="400.0" y="413.0" text-anchor="middle">Tools &amp; APIs</text>
  <text x="400.0" y="428.0" text-anchor="middle" font-size="11">search, code, DBs</text>
  <text x="650.0" y="413.0" text-anchor="middle">Environment</text>
