<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" role="img" aria-label="CoALA at a glance, adapted from Sumers et al. (2023): an agent is long-term memory (procedural, semantic, episodic), a working memory where the language model reasons, and an action space that is either internal (retrieval, reasoning, learning) or external (grounding in the world)." class="sketch" font-family="Kalam, 'Segoe Print', 'Comic Sans MS', cursive" font-size="13" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
<style>/* standalone viewing only — stripped when the figure is inlined into a page */
svg{color:#17202b} .sk-bg{fill:#ffffff} .sk-fill{fill:#e0e7ff} .sk-accent{stroke:#4338ca} text.sk-accent{fill:#4338ca;stroke:none}
@media (prefers-color-scheme:dark){svg{color:#e4e9ef} .sk-bg{fill:#161d25} .sk-fill{fill:#1e1b4b} .sk-accent{stroke:#a5b4fc} text.sk-accent{fill:#a5b4fc}}
</style>
