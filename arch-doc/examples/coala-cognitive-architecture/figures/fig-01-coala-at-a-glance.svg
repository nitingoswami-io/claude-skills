<g fill="currentColor" stroke="none">
  <text x="32" y="40" text-anchor="start" font-size="12" font-weight="700">Long-term memory</text>
  <text x="150.0" y="96.0" text-anchor="middle">Procedural</text>
  <text x="150.0" y="111.0" text-anchor="middle" font-size="11">how to act: prompts, code</text>
  <text x="400.0" y="96.0" text-anchor="middle">Semantic</text>
  <text x="400.0" y="111.0" text-anchor="middle" font-size="11">what is true: facts, docs</text>
  <text x="650.0" y="96.0" text-anchor="middle">Episodic</text>
  <text x="650.0" y="111.0" text-anchor="middle" font-size="11">what happened: past turns</text>
  <text x="400.0" y="265.0" text-anchor="middle" class="sk-accent">Working memory</text>
  <text x="400.0" y="280.0" text-anchor="middle" font-size="11">goal · context · scratchpad</text>
  <text x="400" y="300" text-anchor="middle" font-size="11">the LLM reasons over this</text>
  <rect class="sk-bg" x="170" y="174" width="33" height="17" rx="3"/>
  <text x="186" y="186" text-anchor="middle" font-size="12">load</text>
  <rect class="sk-bg" x="368" y="174" width="64" height="17" rx="3"/>
  <text x="400" y="186" text-anchor="middle" class="sk-accent" font-size="12">retrieval</text>
