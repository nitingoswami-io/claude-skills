<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 300" role="img" aria-label="The CoALA decision cycle, adapted from Sumers et al. (2023): in planning the agent proposes candidate actions, evaluates them and selects one; in execution it performs the chosen internal or external action, observes the result, and the cycle repeats." class="sketch" font-family="Kalam, 'Segoe Print', 'Comic Sans MS', cursive" font-size="13" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
<style>/* standalone viewing only — stripped when the figure is inlined into a page */
svg{color:#17202b} .sk-bg{fill:#ffffff} .sk-fill{fill:#e0e7ff} .sk-accent{stroke:#4338ca} text.sk-accent{fill:#4338ca;stroke:none}
@media (prefers-color-scheme:dark){svg{color:#e4e9ef} .sk-bg{fill:#161d25} .sk-fill{fill:#1e1b4b} .sk-accent{stroke:#a5b4fc} text.sk-accent{fill:#a5b4fc}}
</style>
<defs>
<filter id="rough" x="-3%" y="-3%" width="106%" height="106%"><feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="32" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="2.6" xChannelSelector="R" yChannelSelector="G"/></filter>
<marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1.5 1.5 L8.5 5 L1.5 8.5" fill="none" stroke="currentColor" stroke-width="1.4"/></marker>
<marker id="arrow-accent" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="sk-accent" d="M1.5 1.5 L8.5 5 L1.5 8.5" fill="none" stroke="currentColor" stroke-width="1.4"/></marker>
</defs>
<g filter="url(#rough)">
  <rect x="20" y="30" width="470" height="120" rx="10" stroke-dasharray="7 5" stroke-width="1.2"/>
  <rect x="40" y="70" width="130" height="56" rx="6" class="sk-accent"/>
  <rect x="195" y="70" width="130" height="56" rx="6" class="sk-accent"/>
  <rect x="350" y="70" width="120" height="56" rx="6"/>
  <path d="M170 98 L195 98" class="sk-accent" marker-end="url(#arrow-accent)"/>
  <path d="M325 98 L350 98" marker-end="url(#arrow)"/>
  <rect x="530" y="30" width="230" height="120" rx="10" stroke-dasharray="7 5" stroke-width="1.2"/>
  <rect x="550" y="70" width="190" height="56" rx="6"/>
  <path d="M470 98 L550 98" marker-end="url(#arrow)"/>
  <rect x="550" y="200" width="190" height="56" rx="6"/>
  <path d="M645 126 L645 200" marker-end="url(#arrow)"/>
  <path d="M550 228 L105 228 L105 126" class="sk-accent" marker-end="url(#arrow-accent)"/>
</g>
<g fill="currentColor" stroke="none">
  <text x="32" y="50" text-anchor="start" font-size="12" font-weight="700">Planning</text>
  <text x="105.0" y="95.0" text-anchor="middle" class="sk-accent">Propose</text>
  <text x="105.0" y="110.0" text-anchor="middle" font-size="11">candidate actions</text>
  <text x="260.0" y="95.0" text-anchor="middle" class="sk-accent">Evaluate</text>
  <text x="260.0" y="110.0" text-anchor="middle" font-size="11">score each one</text>
  <text x="410.0" y="95.0" text-anchor="middle">Select</text>
  <text x="410.0" y="110.0" text-anchor="middle" font-size="11">pick one</text>
  <text x="542" y="50" text-anchor="start" font-size="12" font-weight="700">Execution</text>
  <text x="645.0" y="95.0" text-anchor="middle">Act</text>
  <text x="645.0" y="110.0" text-anchor="middle" font-size="11">internal or external</text>
  <rect class="sk-bg" x="466" y="74" width="88" height="17" rx="3"/>
  <text x="510" y="86" text-anchor="middle" font-size="12">chosen action</text>
  <text x="645.0" y="225.0" text-anchor="middle">Observe</text>
  <text x="645.0" y="240.0" text-anchor="middle" font-size="11">result → working memory</text>
  <rect class="sk-bg" x="212" y="208" width="237" height="17" rx="3"/>
  <text x="330" y="220" text-anchor="middle" class="sk-accent" font-size="12">next cycle (until done or budget hit)</text>
</g>
</svg>
