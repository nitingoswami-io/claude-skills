<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 330" role="img" aria-label="How a skill runs: a skill folder is copied into Claude; a prompt that matches the description in SKILL.md loads it, Claude follows its steps, reads references and assets on demand, runs any scripts, and writes the outputs." class="sketch" font-family="Kalam, 'Segoe Print', 'Comic Sans MS', cursive" font-size="13" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
<style>/* standalone viewing only — stripped when the figure is inlined into a page */
svg{color:#17202b} .sk-bg{fill:#ffffff} .sk-fill{fill:#e3f2ef} .sk-accent{stroke:#0f766e} text.sk-accent{fill:#0f766e;stroke:none}
@media (prefers-color-scheme:dark){svg{color:#e4e9ef} .sk-bg{fill:#161d25} .sk-fill{fill:#15302d} .sk-accent{stroke:#4fd1c0} text.sk-accent{fill:#4fd1c0}}
</style>
<defs>
<filter id="rough" x="-3%" y="-3%" width="106%" height="106%"><feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="7" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="2.6" xChannelSelector="R" yChannelSelector="G"/></filter>
<marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1.5 1.5 L8.5 5 L1.5 8.5" fill="none" stroke="currentColor" stroke-width="1.4"/></marker>
<marker id="arrow-accent" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="sk-accent" d="M1.5 1.5 L8.5 5 L1.5 8.5" fill="none" stroke="currentColor" stroke-width="1.4"/></marker>
</defs>
<g filter="url(#rough)">
  <rect x="30" y="24" width="190" height="48" rx="6"/>
  <path d="M220 48 L400 48" marker-end="url(#arrow)"/>
  <rect x="400" y="24" width="210" height="48" rx="6"/>
  <path d="M505 72 L505 112 L330 112 L330 182" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
  <rect x="30" y="190" width="150" height="60" rx="6"/>
  <path d="M180 220 L250 220" class="sk-accent" marker-end="url(#arrow-accent)"/>
  <rect x="250" y="185" width="160" height="70" rx="6" class="sk-accent sk-fill"/>
  <path d="M410 205 L455 205 L455 170 L500 170" marker-end="url(#arrow)"/>
  <rect x="500" y="145" width="170" height="50" rx="6"/>
  <path d="M410 235 L455 235 L455 285 L500 285" marker-end="url(#arrow)"/>
  <rect x="500" y="260" width="170" height="50" rx="6"/>
  <path d="M670 170 L720 170 L720 205 L750 205" marker-end="url(#arrow)"/>
  <path d="M670 285 L720 285 L720 235 L750 235" marker-end="url(#arrow)"/>
  <rect x="750" y="185" width="145" height="70" rx="6" class="sk-accent"/>
</g>
<g fill="currentColor" stroke="none">
  <text x="125.0" y="52.0" text-anchor="middle">claude-skills/&lt;skill&gt;/</text>
  <rect class="sk-bg" x="235" y="26" width="150" height="17" rx="3"/>
  <text x="310" y="38" text-anchor="middle" font-size="12">cp -r, or upload .skill</text>
  <text x="505.0" y="52.0" text-anchor="middle">~/.claude/skills or Desktop</text>
  <rect class="sk-bg" x="386" y="92" width="64" height="17" rx="3"/>
  <text x="418" y="104" text-anchor="middle" font-size="12">installed</text>
  <text x="105.0" y="217.0" text-anchor="middle">your prompt</text>
  <text x="105.0" y="232.0" text-anchor="middle" font-size="11">&quot;teardown of X&quot;</text>
  <text x="215" y="196" text-anchor="middle" class="sk-accent" font-size="12">matches</text>
  <text x="215" y="211" text-anchor="middle" class="sk-accent" font-size="12">description</text>
  <text x="330.0" y="217.0" text-anchor="middle" class="sk-accent">SKILL.md</text>
  <text x="330.0" y="232.0" text-anchor="middle" font-size="11">steps + rules</text>
  <rect class="sk-bg" x="451" y="148" width="39" height="17" rx="3"/>
  <text x="470" y="160" text-anchor="middle" font-size="12">reads</text>
  <text x="585.0" y="174.0" text-anchor="middle">references/ assets/</text>
  <rect class="sk-bg" x="459" y="296" width="33" height="17" rx="3"/>
  <text x="475" y="308" text-anchor="middle" font-size="12">runs</text>
  <text x="585.0" y="282.0" text-anchor="middle">scripts/</text>
  <text x="585.0" y="297.0" text-anchor="middle" font-size="11">render · build · check</text>
  <text x="822.5" y="217.0" text-anchor="middle" class="sk-accent">outputs</text>
  <text x="822.5" y="232.0" text-anchor="middle" font-size="11">article · deck · doc</text>
</g>
</svg>

