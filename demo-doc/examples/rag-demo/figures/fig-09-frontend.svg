<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 270" role="img" aria-label="Frontend component tree: page.tsx lays out UploadPanel and ChatPanel; ChatPanel renders MessageBubble; both panels call the API through lib/api.ts." class="sketch" font-family="Kalam, 'Segoe Print', 'Comic Sans MS', cursive" font-size="13" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
<style>/* standalone viewing only — stripped when the figure is inlined into a page */
svg{color:#17202b} .sk-bg{fill:#ffffff} .sk-fill{fill:#e3f2ef} .sk-accent{stroke:#0f766e} text.sk-accent{fill:#0f766e;stroke:none}
@media (prefers-color-scheme:dark){svg{color:#e4e9ef} .sk-bg{fill:#161d25} .sk-fill{fill:#15302d} .sk-accent{stroke:#4fd1c0} text.sk-accent{fill:#4fd1c0}}
</style>
<defs>
<filter id="rough" x="-3%" y="-3%" width="106%" height="106%"><feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="12" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="2.6" xChannelSelector="R" yChannelSelector="G"/></filter>
<marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1.5 1.5 L8.5 5 L1.5 8.5" fill="none" stroke="currentColor" stroke-width="1.4"/></marker>
<marker id="arrow-accent" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="sk-accent" d="M1.5 1.5 L8.5 5 L1.5 8.5" fill="none" stroke="currentColor" stroke-width="1.4"/></marker>
</defs>
<g filter="url(#rough)">
  <rect x="220" y="20" width="260" height="44" rx="6"/>
  <rect x="40" y="110" width="240" height="44" rx="6"/>
  <rect x="420" y="110" width="240" height="44" rx="6" class="sk-accent"/>
  <rect x="420" y="200" width="240" height="44" rx="6"/>
  <rect x="110" y="200" width="240" height="44" rx="6"/>
  <path d="M300 64 L190 110" marker-end="url(#arrow)"/>
  <path d="M400 64 L510 110" marker-end="url(#arrow)"/>
  <path d="M540 154 L540 200" marker-end="url(#arrow)"/>
  <path d="M160 154 L200 200" marker-end="url(#arrow)"/>
  <path d="M420 140 L330 200" class="sk-accent" marker-end="url(#arrow-accent)"/>
</g>
<g fill="currentColor" stroke="none">
  <text x="350.0" y="39.0" text-anchor="middle">app/page.tsx</text>
  <text x="350.0" y="54.0" text-anchor="middle" font-size="11">two columns, stacks on mobile</text>
  <text x="160.0" y="129.0" text-anchor="middle">UploadPanel</text>
  <text x="160.0" y="144.0" text-anchor="middle" font-size="11">files · uploading · docs</text>
  <text x="540.0" y="129.0" text-anchor="middle" class="sk-accent">ChatPanel</text>
  <text x="540.0" y="144.0" text-anchor="middle" font-size="11">messages · input · loading</text>
  <text x="540.0" y="219.0" text-anchor="middle">MessageBubble</text>
  <text x="540.0" y="234.0" text-anchor="middle" font-size="11">answer + Sources</text>
  <text x="230.0" y="219.0" text-anchor="middle">lib/api.ts</text>
  <text x="230.0" y="234.0" text-anchor="middle" font-size="11">uploadFiles · listDocuments · sendChat</text>
  <rect class="sk-bg" x="371" y="174" width="57" height="17" rx="3"/>
  <text x="400" y="186" text-anchor="middle" class="sk-accent" font-size="12">sendChat</text>
</g>
</svg>
