<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 300" role="img" aria-label="Frontend component tree: page.tsx lays out four panels; KnowledgeBase shows the packs and, in local mode, UploadPanel; ChatPanel renders MessageBubble; selecting an answer feeds InsightPanel and EvidencePanel. All API calls go through lib/api.ts." class="sketch" font-family="Kalam, 'Segoe Print', 'Comic Sans MS', cursive" font-size="13" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
<style>/* standalone viewing only — stripped when the figure is inlined into a page */
svg{color:#17202b} .sk-bg{fill:#ffffff} .sk-fill{fill:#e3f2ef} .sk-accent{stroke:#0f766e} text.sk-accent{fill:#0f766e;stroke:none}
@media (prefers-color-scheme:dark){svg{color:#e4e9ef} .sk-bg{fill:#161d25} .sk-fill{fill:#15302d} .sk-accent{stroke:#4fd1c0} text.sk-accent{fill:#4fd1c0}}
</style>
<defs>
<filter id="rough" x="-3%" y="-3%" width="106%" height="106%"><feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="12" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="2.6" xChannelSelector="R" yChannelSelector="G"/></filter>
<marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1.5 1.5 L8.5 5 L1.5 8.5" fill="none" stroke="currentColor" stroke-width="1.4"/></marker>
<marker id="arrow-accent" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="sk-accent" d="M1.5 1.5 L8.5 5 L1.5 8.5" fill="none" stroke="currentColor" stroke-width="1.4"/></marker>
</defs>
<g filter="url(#rough)">
  <rect x="250" y="16" width="360" height="44" rx="6"/>
  <rect x="20" y="110" width="190" height="44" rx="6"/>
  <path d="M430 60 L115 110" marker-end="url(#arrow)"/>
  <rect x="230" y="110" width="190" height="44" rx="6" class="sk-accent"/>
  <path d="M430 60 L325 110" class="sk-accent" marker-end="url(#arrow-accent)"/>
  <rect x="440" y="110" width="190" height="44" rx="6"/>
  <path d="M430 60 L535 110" marker-end="url(#arrow)"/>
  <rect x="650" y="110" width="190" height="44" rx="6"/>
  <path d="M430 60 L745 110" marker-end="url(#arrow)"/>
  <rect x="20" y="196" width="190" height="44" rx="6"/>
  <rect x="230" y="196" width="190" height="44" rx="6"/>
  <path d="M115 154 L115 196" marker-end="url(#arrow)"/>
  <path d="M325 154 L325 196" marker-end="url(#arrow)"/>
  <rect x="440" y="220" width="400" height="44" rx="6"/>
  <path d="M420 140 L520 220" class="sk-accent" marker-end="url(#arrow-accent)"/>
  <path d="M745 154 L745 220" marker-end="url(#arrow)"/>
</g>
<g fill="currentColor" stroke="none">
  <text x="430.0" y="35.0" text-anchor="middle">app/page.tsx</text>
  <text x="430.0" y="50.0" text-anchor="middle" font-size="11">3 columns + bottom panel · chat thread per pack</text>
  <text x="115.0" y="129.0" text-anchor="middle">KnowledgeBase</text>
  <text x="115.0" y="144.0" text-anchor="middle" font-size="11">1 · packs, documents</text>
  <text x="325.0" y="129.0" text-anchor="middle" class="sk-accent">ChatPanel</text>
  <text x="325.0" y="144.0" text-anchor="middle" font-size="11">2 · thread, suggestions</text>
  <text x="535.0" y="129.0" text-anchor="middle">InsightPanel</text>
  <text x="535.0" y="144.0" text-anchor="middle" font-size="11">3 · steps, timings, tokens</text>
  <text x="745.0" y="129.0" text-anchor="middle">EvidencePanel</text>
  <text x="745.0" y="144.0" text-anchor="middle" font-size="11">sources table · DB rows</text>
  <text x="115.0" y="215.0" text-anchor="middle">UploadPanel</text>
  <text x="115.0" y="230.0" text-anchor="middle" font-size="11">local mode only</text>
  <text x="325.0" y="215.0" text-anchor="middle">MessageBubble</text>
  <text x="325.0" y="230.0" text-anchor="middle" font-size="11">answer · cited sources</text>
  <text x="640.0" y="239.0" text-anchor="middle">lib/api.ts</text>
  <text x="640.0" y="254.0" text-anchor="middle" font-size="11">fetch wrappers for every route</text>
  <rect class="sk-bg" x="441" y="184" width="57" height="17" rx="3"/>
  <text x="470" y="196" text-anchor="middle" class="sk-accent" font-size="12">sendChat</text>
  <rect class="sk-bg" x="761" y="180" width="57" height="17" rx="3"/>
  <text x="790" y="192" text-anchor="middle" font-size="12">listRows</text>
</g>
</svg>
