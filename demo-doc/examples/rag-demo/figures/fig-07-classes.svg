</g>
<g fill="currentColor" stroke="none">
  <text x="400.0" y="35" text-anchor="middle" font-weight="700">main</text>
  <text x="310" y="62" text-anchor="start" font-size="11.5">+GET /health</text>
  <text x="310" y="79" text-anchor="start" font-size="11.5">+POST /upload</text>
  <text x="310" y="96" text-anchor="start" font-size="11.5">+GET /documents</text>
  <text x="310" y="113" text-anchor="start" font-size="11.5">+POST /chat</text>
  <text x="150.0" y="189" text-anchor="middle" font-weight="700">ingest</text>
  <text x="50" y="216" text-anchor="start" font-size="11.5">+ingest_file(path, name) int</text>
  <text x="50" y="233" text-anchor="start" font-size="11.5">-_load(path, name)</text>
  <text x="50" y="250" text-anchor="start" font-size="11.5">-_split(docs)</text>
  <text x="650.0" y="189" text-anchor="middle" class="sk-accent" font-weight="700">rag</text>
  <text x="550" y="216" text-anchor="start" font-size="11.5">+answer(question, history) dict</text>
  <text x="550" y="233" text-anchor="start" font-size="11.5">-_format_context(docs) str</text>
