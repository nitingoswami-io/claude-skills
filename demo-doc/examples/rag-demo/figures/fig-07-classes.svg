</g>
<g fill="currentColor" stroke="none">
  <text x="430.0" y="35" text-anchor="middle" font-weight="700">main</text>
  <text x="330" y="62" text-anchor="start" font-size="11.5">+GET /health · /config</text>
  <text x="330" y="79" text-anchor="start" font-size="11.5">+GET /packs · /packs/{id}/rows</text>
  <text x="330" y="96" text-anchor="start" font-size="11.5">+POST /chat</text>
  <text x="330" y="113" text-anchor="start" font-size="11.5">+POST /upload (local mode)</text>
  <text x="330" y="130" text-anchor="start" font-size="11.5">+DELETE /documents/{name}</text>
  <text x="130.0" y="49" text-anchor="middle" font-weight="700">samples</text>
  <text x="30" y="76" text-anchor="start" font-size="11.5">+packs() list[dict]</text>
  <text x="30" y="93" text-anchor="start" font-size="11.5">+seed()</text>
  <text x="30" y="110" text-anchor="start" font-size="11.5">+pack_ids() set[str]</text>
  <text x="140.0" y="209" text-anchor="middle" font-weight="700">ingest</text>
  <text x="30" y="236" text-anchor="start" font-size="11.5">+ingest_file(path, name, pack)</text>
  <text x="30" y="253" text-anchor="start" font-size="11.5">-_load · _split · _file_hash</text>
  <text x="720.0" y="209" text-anchor="middle" class="sk-accent" font-weight="700">rag</text>
  <text x="610" y="236" text-anchor="start" font-size="11.5">+answer(question, history, pack)</text>
  <text x="610" y="253" text-anchor="start" font-size="11.5">-_format_context(docs) str</text>
  <text x="610" y="270" text-anchor="start" font-size="11.5">-_llm() ChatOpenAI</text>
  <text x="430.0" y="229" text-anchor="middle" class="sk-accent" font-weight="700">vectorstore</text>
  <text x="310" y="256" text-anchor="start" font-size="11.5">+get_vector_store() PGVector</text>
  <text x="310" y="273" text-anchor="start" font-size="11.5">+pack_documents · pack_rows</text>
  <text x="310" y="290" text-anchor="start" font-size="11.5">+stored_versions · delete_stale</text>
  <text x="310" y="307" text-anchor="start" font-size="11.5">+delete_source · count_chunks</text>
  <text x="430.0" y="399" text-anchor="middle" font-weight="700">Settings</text>
  <text x="330" y="426" text-anchor="start" font-size="11.5">chat_model · embedding_model</text>
  <text x="330" y="443" text-anchor="start" font-size="11.5">chunk_size · chunk_overlap · top_k</text>
  <text x="330" y="460" text-anchor="start" font-size="11.5">allow_uploads · rate limits</text>
  <text x="135.0" y="399" text-anchor="middle" font-weight="700">ChatRequest</text>
  <text x="30" y="426" text-anchor="start" font-size="11.5">message: str (≤ 1000)</text>
  <text x="30" y="443" text-anchor="start" font-size="11.5">history: Message[] (≤ 20)</text>
  <text x="30" y="460" text-anchor="start" font-size="11.5">pack: str</text>
  <text x="720.0" y="399" text-anchor="middle" font-weight="700">ChatResponse</text>
  <text x="610" y="426" text-anchor="start" font-size="11.5">answer: str</text>
  <text x="610" y="443" text-anchor="start" font-size="11.5">sources: Source[]</text>
  <text x="610" y="460" text-anchor="start" font-size="11.5">stats: Stats</text>
  <text x="135" y="490" text-anchor="middle" font-size="11">◆ holds Message {role, content}</text>
  <text x="720" y="490" text-anchor="middle" font-size="11">◆ Source {rank, source, page, chunk, score}</text>
  <text x="720" y="510" text-anchor="middle" font-size="11">◆ Stats {retrieve_ms, generate_ms, tokens}</text>
</g>
</svg>
