  <text x="310" y="376" text-anchor="start" font-size="11.5">chat_model · embedding_model</text>
  <text x="310" y="393" text-anchor="start" font-size="11.5">chunk_size · chunk_overlap</text>
  <text x="310" y="410" text-anchor="start" font-size="11.5">top_k · history_turns</text>
  <text x="140.0" y="349" text-anchor="middle" font-weight="700">ChatRequest</text>
  <text x="50" y="376" text-anchor="start" font-size="11.5">message: str</text>
  <text x="50" y="393" text-anchor="start" font-size="11.5">history: Message[]</text>
  <text x="660.0" y="389" text-anchor="middle" font-weight="700">ChatResponse</text>
  <text x="570" y="416" text-anchor="start" font-size="11.5">answer: str</text>
  <text x="570" y="433" text-anchor="start" font-size="11.5">sources: Source[]</text>
  <text x="140" y="430" text-anchor="middle" font-size="11">◆ holds Message {role, content}</text>
  <text x="660" y="460" text-anchor="middle" font-size="11">◆ holds Source {source, page, snippet}</text>
</g>
</svg>
