  <rect x="600" y="190" width="240" height="89" rx="4" class="sk-accent"/>
  <path d="M600 218 H840"/>
  <rect x="300" y="210" width="260" height="106" rx="4" class="sk-accent"/>
  <path d="M300 238 H560"/>
  <rect x="320" y="380" width="220" height="89" rx="4"/>
  <path d="M320 408 H540"/>
  <path d="M320 60 L240 70" marker-end="url(#arrow)"/>
