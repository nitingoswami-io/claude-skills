  <path d="M360 137 L220 190" marker-end="url(#arrow)"/>
  <path d="M500 137 L660 190" class="sk-accent" marker-end="url(#arrow-accent)"/>
  <path d="M430 137 L430 210" marker-end="url(#arrow)"/>
  <path d="M260 230 L300 240" marker-end="url(#arrow)"/>
  <path d="M600 235 L560 245" class="sk-accent" marker-end="url(#arrow-accent)"/>
  <path d="M430 314 L430 380" marker-end="url(#arrow)"/>
  <rect x="20" y="380" width="230" height="89" rx="4"/>
  <path d="M20 408 H250"/>
  <rect x="600" y="380" width="240" height="89" rx="4"/>
