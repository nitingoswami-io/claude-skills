<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 571.7 506" role="img" aria-label="Sequence diagram of ingestion: at startup (and for uploads in local mode) each file is hashed; an unchanged file is skipped, otherwise it is loaded, split into 1000-character chunks, embedded, stored in pgvector, and any older version is deleted." class="sketch" font-family="Kalam, 'Segoe Print', 'Comic Sans MS', cursive" font-size="13" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
<style>/* standalone viewing only — stripped when the figure is inlined into a page */
svg{color:#17202b} .sk-bg{fill:#ffffff} .sk-fill{fill:#e3f2ef} .sk-accent{stroke:#0f766e} text.sk-accent{fill:#0f766e;stroke:none}
@media (prefers-color-scheme:dark){svg{color:#e4e9ef} .sk-bg{fill:#161d25} .sk-fill{fill:#15302d} .sk-accent{stroke:#4fd1c0} text.sk-accent{fill:#4fd1c0}}
</style>
<defs>
<filter id="rough" x="-3%" y="-3%" width="106%" height="106%"><feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="7" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="2.6" xChannelSelector="R" yChannelSelector="G"/></filter>
<marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1.5 1.5 L8.5 5 L1.5 8.5" fill="none" stroke="currentColor" stroke-width="1.4"/></marker>
<marker id="arrow-accent" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="sk-accent" d="M1.5 1.5 L8.5 5 L1.5 8.5" fill="none" stroke="currentColor" stroke-width="1.4"/></marker>
</defs>
<g filter="url(#rough)">
  <rect x="4.049999999999997" y="24" width="131.9" height="34" rx="6"/>
  <path d="M70.0 58 V490" stroke-dasharray="3 6" stroke-width="1"/>
  <rect x="171.9" y="24" width="84" height="34" rx="6"/>
  <path d="M213.9 58 V490" stroke-dasharray="3 6" stroke-width="1"/>
  <rect x="295.2" y="24" width="125.2" height="34" rx="6"/>
  <path d="M357.8 58 V490" stroke-dasharray="3 6" stroke-width="1"/>
  <rect x="459.70000000000005" y="24" width="84" height="34" rx="6"/>
  <path d="M501.70000000000005 58 V490" stroke-dasharray="3 6" stroke-width="1"/>
  <path d="M74.0 116 L209.9 116" marker-end="url(#arrow)"/>
  <path d="M213.9 140 L239.9 140 L239.9 152 L216.9 152" marker-end="url(#arrow)"/>
  <path d="M217.9 176 L497.70000000000005 176" marker-end="url(#arrow)"/>
  <path d="M497.70000000000005 206 L217.9 206" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
  <path d="M213.9 230 L239.9 230 L239.9 242 L216.9 242" marker-end="url(#arrow)"/>
  <path d="M213.9 260 L239.9 260 L239.9 272 L216.9 272" marker-end="url(#arrow)"/>
  <path d="M213.9 290 L239.9 290 L239.9 302 L216.9 302" marker-end="url(#arrow)"/>
  <path d="M217.9 326 L353.8 326" class="sk-accent" marker-end="url(#arrow-accent)"/>
  <path d="M353.8 356 L217.9 356" class="sk-accent" stroke-dasharray="6 5" marker-end="url(#arrow-accent)"/>
  <path d="M217.9 386 L497.70000000000005 386" class="sk-accent" marker-end="url(#arrow-accent)"/>
  <path d="M217.9 416 L497.70000000000005 416" marker-end="url(#arrow)"/>
  <path d="M209.9 446 L74.0 446" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
</g>
<g fill="currentColor" stroke="none">
  <text x="70.0" y="45.0" text-anchor="middle">seed() or /upload</text>
  <text x="213.9" y="45.0" text-anchor="middle">ingest.py</text>
  <text x="357.8" y="45.0" text-anchor="middle">OpenAIEmbeddings</text>
  <text x="501.70000000000005" y="45.0" text-anchor="middle">pgvector</text>
  <rect class="sk-bg" x="24" y="97" width="237" height="17" rx="3"/>
  <text x="141.95" y="109" text-anchor="middle" font-size="12">1  each file: ingest_file(name, pack)</text>
  <text x="247.9" y="150" text-anchor="start" font-size="12">2  sha256 of the file</text>
  <rect class="sk-bg" x="280" y="157" width="156" height="17" rx="3"/>
  <text x="357.8" y="169" text-anchor="middle" font-size="12">3  stored_versions(name)</text>
  <rect class="sk-bg" x="286" y="187" width="144" height="17" rx="3"/>
  <text x="357.8" y="199" text-anchor="middle" font-size="12">4  {(file_hash, pack)}</text>
  <text x="247.9" y="240" text-anchor="start" font-size="12">5  Same hash + pack? Skip</text>
  <text x="247.9" y="270" text-anchor="start" font-size="12">6  Load, split 1000 / 150</text>
  <text x="247.9" y="300" text-anchor="start" font-size="12">7  Tag chunks: pack, chunk, hash</text>
  <rect class="sk-bg" x="201" y="307" width="169" height="17" rx="3"/>
  <text x="285.85" y="319" text-anchor="middle" class="sk-accent" font-size="12">8  embed_documents(chunks)</text>
  <rect class="sk-bg" x="214" y="337" width="144" height="17" rx="3"/>
  <text x="285.85" y="349" text-anchor="middle" class="sk-accent" font-size="12">9  vectors (1536 dims)</text>
  <rect class="sk-bg" x="267" y="367" width="181" height="17" rx="3"/>
  <text x="357.8" y="379" text-anchor="middle" class="sk-accent" font-size="12">10  INSERT rows (stable ids)</text>
  <rect class="sk-bg" x="252" y="397" width="212" height="17" rx="3"/>
  <text x="357.8" y="409" text-anchor="middle" font-size="12">11  delete_stale(name, keep=hash)</text>
  <rect class="sk-bg" x="11" y="427" width="262" height="17" rx="3"/>
  <text x="141.95" y="439" text-anchor="middle" font-size="12">12  (chunks, added | updated | unchanged)</text>
</g>
</svg>
