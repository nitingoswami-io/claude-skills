<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 826.0 596" role="img" aria-label="Sequence diagram of ingestion: each uploaded file is validated, loaded, split into 1000-character chunks, embedded and inserted into pgvector, and the UI then lists the indexed documents." class="sketch" font-family="Kalam, 'Segoe Print', 'Comic Sans MS', cursive" font-size="13" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
