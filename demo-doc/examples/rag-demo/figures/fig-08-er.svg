<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 230" role="img" aria-label="Entity-relationship diagram: one langchain_pg_collection row contains many langchain_pg_embedding rows, each holding the chunk text, a 1536-dimension vector and JSONB metadata including its knowledge base (pack) and file hash." class="sketch" font-family="Kalam, 'Segoe Print', 'Comic Sans MS', cursive" font-size="13" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
<style>/* standalone viewing only — stripped when the figure is inlined into a page */
svg{color:#17202b} .sk-bg{fill:#ffffff} .sk-fill{fill:#e3f2ef} .sk-accent{stroke:#0f766e} text.sk-accent{fill:#0f766e;stroke:none}
@media (prefers-color-scheme:dark){svg{color:#e4e9ef} .sk-bg{fill:#161d25} .sk-fill{fill:#15302d} .sk-accent{stroke:#4fd1c0} text.sk-accent{fill:#4fd1c0}}
</style>
<defs>
<filter id="rough" x="-3%" y="-3%" width="106%" height="106%"><feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="11" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="2.6" xChannelSelector="R" yChannelSelector="G"/></filter>
<marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1.5 1.5 L8.5 5 L1.5 8.5" fill="none" stroke="currentColor" stroke-width="1.4"/></marker>
<marker id="arrow-accent" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="sk-accent" d="M1.5 1.5 L8.5 5 L1.5 8.5" fill="none" stroke="currentColor" stroke-width="1.4"/></marker>
</defs>
<g filter="url(#rough)">
  <rect x="20" y="30" width="250" height="96" rx="4"/>
  <path d="M20 58 H270"/>
  <rect x="420" y="30" width="300" height="156" rx="4" class="sk-accent"/>
  <path d="M420 58 H720"/>
  <path d="M270 80 L420 80"/>
  <path d="M282 72 V88 M288 72 V88"/>
  <path d="M420 72 L406 80 L420 88 M400 72 V88"/>
</g>
<g fill="currentColor" stroke="none">
  <text x="145.0" y="49" text-anchor="middle" font-weight="700">langchain_pg_collection</text>
  <text x="30" y="77" text-anchor="start" font-size="11.5">uuid uuid</text>
  <text x="260" y="77" text-anchor="end" font-size="11">PK</text>
  <text x="30" y="97" text-anchor="start" font-size="11.5">name varchar</text>
  <text x="260" y="97" text-anchor="end" font-size="11">&quot;docs&quot;</text>
  <text x="30" y="117" text-anchor="start" font-size="11.5">cmetadata jsonb</text>
  <text x="570.0" y="49" text-anchor="middle" class="sk-accent" font-weight="700">langchain_pg_embedding</text>
  <text x="430" y="77" text-anchor="start" font-size="11.5">id varchar</text>
  <text x="710" y="77" text-anchor="end" font-size="11">PK (stable)</text>
  <text x="430" y="97" text-anchor="start" font-size="11.5">collection_id uuid</text>
  <text x="710" y="97" text-anchor="end" font-size="11">FK</text>
  <text x="430" y="117" text-anchor="start" font-size="11.5">embedding vector</text>
  <text x="710" y="117" text-anchor="end" font-size="11">1536 dims</text>
  <text x="430" y="137" text-anchor="start" font-size="11.5">document varchar</text>
  <text x="710" y="137" text-anchor="end" font-size="11">chunk text</text>
  <text x="430" y="157" text-anchor="start" font-size="11.5">cmetadata jsonb</text>
  <text x="710" y="157" text-anchor="end" font-size="11">source, page, chunk,</text>
  <text x="430" y="177" text-anchor="start" font-size="11.5"></text>
  <text x="710" y="177" text-anchor="end" font-size="11">pack, file_hash</text>
  <text x="345" y="70" text-anchor="middle" font-size="12">contains</text>
</g>
</svg>
