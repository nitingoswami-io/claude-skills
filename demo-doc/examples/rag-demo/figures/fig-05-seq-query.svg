<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 963.1999999999999 566" role="img" aria-label="Sequence diagram of one chat turn: the question is embedded, the top four chunks in the selected knowledge base are retrieved from pgvector with their similarity scores, a prompt is built from rules, context and recent history, and the grounded answer returns with its sources and timings." class="sketch" font-family="Kalam, 'Segoe Print', 'Comic Sans MS', cursive" font-size="13" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
<style>/* standalone viewing only — stripped when the figure is inlined into a page */
svg{color:#17202b} .sk-bg{fill:#ffffff} .sk-fill{fill:#e3f2ef} .sk-accent{stroke:#0f766e} text.sk-accent{fill:#0f766e;stroke:none}
